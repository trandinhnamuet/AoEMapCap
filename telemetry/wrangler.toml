# Cloudflare Worker nhận thống kê sử dụng AoE-MapCap (xem src/index.js). Triển khai: npx wrangler deploy
# Mật khẩu trang /stats: npx wrangler secret put STATS_PASSWORD
name = "aoe-mapcap-telemetry"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "aoe-mapcap-telemetry"
database_id = "3c3ce8b1-5c55-4e91-9246-6254e91b89b4"

# Báo cáo trận có hack: file .aoerec (2026-11-11). Cần bật R2 trong Cloudflare Dashboard, rồi:
#   npx wrangler r2 bucket create aoe-mapcap-reports
[[r2_buckets]]
binding = "REPORTS"
bucket_name = "aoe-mapcap-reports"
