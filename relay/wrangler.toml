# Trạm chuyển tiếp AoE-MapCap máy tính <-> điện thoại khi khác mạng (xem src/index.js) + trang mobile/web.
# Triển khai: npx wrangler deploy (tài khoản Cloudflare của AoE-MapCap)
name = "aoe-mapcap-relay"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

[assets]
directory = "../mobile/web"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[observability]
enabled = true
