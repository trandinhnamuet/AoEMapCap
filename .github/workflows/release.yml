# AoE-MapCap: build bản Windows và đăng Release.
#
# - mỗi lần đẩy lên main: build AoE-MapCap-win64.zip (AoE-MapCap.exe + AoE-Replay.exe), lưu ở Actions > artifact;
# - tag v* (vd v1): đăng thêm GitHub Release kèm chứng nhận nguồn gốc (build provenance) để ai cũng kiểm được exe
#   được build từ commit nào:  gh attestation verify AoE-MapCap.exe -R trandinhnamuet/AoEMapCap
#
# Build hoàn toàn trên máy windows-latest của GitHub bằng đúng script build.py / build_replay.py của repo.
# ffmpeg (chỉ dùng khi xuất video) lấy từ gói imageio-ffmpeg 0.6.0 (bản 7.1 essentials), như bản build tay.
name: release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  win64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài gói
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 pillow==12.2.0 psutil==5.9.7 pygame-ce==2.5.8 moderngl==5.13.0 glcontext==3.1.0 `
                      pyinstaller==6.20.0 imageio-ffmpeg==0.6.0

      - name: Lấy ffmpeg
        shell: python
        run: |
          import os, shutil, imageio_ffmpeg
          os.makedirs("vendor", exist_ok=True)
          shutil.copy(imageio_ffmpeg.get_ffmpeg_exe(), os.path.join("vendor", "ffmpeg.exe"))

      - name: Kiểm tra import
        run: python -c "import mapcap.gui, mapcap.engine, replay.viewer, replay.picker; print('ok')"

      - name: Build
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python build_replay.py
          python build.py

      - name: Đóng gói
        id: pkg
        shell: bash
        run: |
          NAME=AoE-MapCap-win64
          mkdir -p "$NAME"
          cp -p dist/AoE-MapCap.exe dist/AoE-Replay.exe README.md "$NAME/"
          echo "source: ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}" > "$NAME/VERSION.txt"
          echo "ref: ${{ github.ref_name }}" >> "$NAME/VERSION.txt"
          (cd "$NAME" && sha256sum AoE-MapCap.exe AoE-Replay.exe > SHA256SUMS.txt)
          7z a -tzip "$NAME.zip" "$NAME" > /dev/null
          sha256sum "$NAME.zip" | tee "$NAME.zip.sha256"
          {
            echo "AoE-MapCap ${{ github.ref_name }}: ghi trận AoE-HD và xem lại như replay Liên Minh Huyền Thoại."
            echo "Build trên GitHub Actions từ commit ${{ github.sha }}."
            echo
            echo "Tải **$NAME.zip**, giải nén, mở \`AoE-MapCap.exe\` (ghi trận + bảng trận đã ghi) hoặc \`AoE-Replay.exe\` (chỉ xem replay)."
            echo "Hướng dẫn: ${{ github.server_url }}/${{ github.repository }}#readme"
            echo
            echo "SHA-256 của zip: \`$(cut -d' ' -f1 "$NAME.zip.sha256")\`"
          } > release-notes.md
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pkg.outputs.name }}-${{ github.run_id }}
          path: ${{ steps.pkg.outputs.name }}/*

      - name: Chứng nhận nguồn gốc
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{ steps.pkg.outputs.name }}.zip
            ${{ steps.pkg.outputs.name }}/AoE-MapCap.exe
            ${{ steps.pkg.outputs.name }}/AoE-Replay.exe

      - name: Đăng Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: AoE-MapCap ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            ${{ steps.pkg.outputs.name }}.zip
            ${{ steps.pkg.outputs.name }}.zip.sha256
