# AoE-MapCap: build bản Windows và đăng Release.
#
# - mỗi lần đẩy lên main: build AoE-MapCap-win64.zip (AoE-MapCap.exe; từ v6 không còn AoE-Replay.exe), lưu ở
#   Actions > artifact;
# - tag v* (vd v1): đăng thêm GitHub Release kèm chứng nhận nguồn gốc (build provenance) để ai cũng kiểm được exe
#   được build từ commit nào:  gh attestation verify AoE-MapCap.exe -R trandinhnamuet/AoEMapCap
#   Số phiên bản trong app = số của tag (release/make_release.py set-version). Release đính kèm zip, zip.sha256 và
#   version.json (bộ tự cập nhật trong app đọc releases/latest/download/version.json, tải zip rồi giải nén exe;
#   từ v5 không đính kèm exe lẻ). Mô tả từng bản lấy từ
#   release/notes/v<N>.md; mỗi lần đăng bản mới thì mô tả các bản cũ cũng được viết lại cho đồng bộ.
#
# Build hoàn toàn trên máy windows-latest của GitHub bằng đúng script build.py của repo.
# ffmpeg (chỉ dùng khi xuất video) lấy từ gói imageio-ffmpeg 0.6.0 (bản 7.1 essentials), như bản build tay.
name: release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  win64:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}     # dùng qua biến môi trường, không chèn thẳng vào lệnh shell
    steps:
      - name: Kiểm tên tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: '[[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*$ ]] || { echo "tag phải có dạng v<N>"; exit 1; }'

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0              # cần các tag cũ để ghi commit vào mô tả bản cũ

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gắn số phiên bản theo tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PYTHONIOENCODING: utf-8
        shell: bash
        run: python release/make_release.py set-version "$TAG"

      - name: Cài gói
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 pillow==12.2.0 psutil==5.9.7 pygame-ce==2.5.8 moderngl==5.13.0 glcontext==3.1.0 `
                      pyinstaller==6.20.0 imageio-ffmpeg==0.6.0

      - name: Lấy ffmpeg
        shell: python
        run: |
          import os, shutil, imageio_ffmpeg
          os.makedirs("vendor", exist_ok=True)
          shutil.copy(imageio_ffmpeg.get_ffmpeg_exe(), os.path.join("vendor", "ffmpeg.exe"))

      - name: Kiểm tra import
        run: python -c "import mapcap.gui, mapcap.engine, mapcap.updater, mapcap.update_ui, replay.viewer, replay.picker; print('ok')"

      - name: Build
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python build.py

      - name: Đóng gói
        id: pkg
        shell: bash
        run: |
          NAME=AoE-MapCap-win64
          mkdir -p "$NAME"
          cp -p dist/AoE-MapCap.exe README.md "$NAME/"
          echo "source: ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}" > "$NAME/VERSION.txt"
          echo "ref: $TAG" >> "$NAME/VERSION.txt"
          python -c "from mapcap.version import APP_VERSION as v; print('version: ' + v)" >> "$NAME/VERSION.txt"
          (cd "$NAME" && sha256sum AoE-MapCap.exe > SHA256SUMS.txt)
          7z a -tzip "$NAME.zip" "$NAME" > /dev/null
          sha256sum "$NAME.zip" | tee "$NAME.zip.sha256"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Mô tả các bản + version.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          NAME=${{ steps.pkg.outputs.name }}
          python release/make_release.py manifest "$TAG" "$NAME.zip" version.json
          python release/make_release.py bodies "$TAG" release-bodies --zip-sha="$(cut -d' ' -f1 "$NAME.zip.sha256")" --commit=${{ github.sha }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pkg.outputs.name }}-${{ github.run_id }}
          path: ${{ steps.pkg.outputs.name }}/*

      - name: Chứng nhận nguồn gốc
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{ steps.pkg.outputs.name }}.zip
            ${{ steps.pkg.outputs.name }}/AoE-MapCap.exe

      - name: Đăng Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: AoE-MapCap ${{ github.ref_name }}
          body_path: release-bodies/${{ github.ref_name }}.md
          make_latest: true
          files: |
            ${{ steps.pkg.outputs.name }}.zip
            ${{ steps.pkg.outputs.name }}.zip.sha256
            version.json

      - name: Viết lại mô tả các bản cũ
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for f in release-bodies/v*.md; do
            t=$(basename "$f" .md)
            [ "$t" = "$TAG" ] && continue
            if gh release view "$t" > /dev/null 2>&1; then
              gh release edit "$t" --notes-file "$f" && echo "đã viết lại mô tả $t"
              for x in AoE-MapCap.exe AoE-Replay.exe; do       # từ v5 không đính kèm exe lẻ (cả bản cũ)
                gh release delete-asset "$t" "$x" -y > /dev/null 2>&1 && echo "đã xoá $x khỏi $t" || true
              done
            fi
          done
