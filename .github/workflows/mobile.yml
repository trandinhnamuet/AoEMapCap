# AoE-MapCap Android: build APK (trang mobile/web trong WebView, dự án mobile/android) và đăng Release.
#
# - đẩy lên main có sửa mobile/**: build APK, lưu ở Actions > artifact;
# - tag mobile-v<N> (vd mobile-v1): đăng Release riêng, KHÔNG đánh dấu "latest" vì app Windows tự cập nhật từ
#   releases/latest. versionCode của APK = N.
#
# Ký APK bằng khoá trong secret ANDROID_KEYSTORE_B64 (file .jks dạng base64) + ANDROID_KEYSTORE_PASSWORD, để bản sau
# cài đè được bản trước. Thiếu secret thì ký bằng khoá debug (phải gỡ bản cũ trước khi cài).
# Không đóng gói đồ hoạ game: gói hình đi từ máy tính của người dùng sang điện thoại của họ.
name: mobile

on:
  push:
    branches: [main]
    tags: ['mobile-v*']
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}     # dùng qua biến môi trường, không chèn thẳng vào lệnh shell
    steps:
      - name: Số phiên bản
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$TAG" =~ ^mobile-v([0-9]+)$ ]] || { echo "tag phải có dạng mobile-v<N>"; exit 1; }
            echo "code=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "code=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Khoá ký
        env:
          KEY_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::thiếu secret ANDROID_KEYSTORE_B64, ký bằng khoá debug"
          fi

      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          gradle -p mobile/android assembleRelease -PversionCode=${{ steps.ver.outputs.code }} --no-daemon
          cp mobile/android/app/build/outputs/apk/release/app-release.apk AoE-MapCap.apk
          sha256sum AoE-MapCap.apk | tee AoE-MapCap.apk.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: AoE-MapCap-android-${{ github.run_id }}
          path: AoE-MapCap.apk

      - name: Chứng nhận nguồn gốc
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: AoE-MapCap.apk

      - name: Đăng Release
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        uses: softprops/action-gh-release@v3
        with:
          name: AoE-MapCap Android ${{ github.ref_name }}
          body_path: mobile/notes/${{ github.ref_name }}.md
          make_latest: false
          files: |
            AoE-MapCap.apk
            AoE-MapCap.apk.sha256
